<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Страница корзины онлайн магазина Seasonal Goods Store. Оформляйте товар в интернет магазине.">
  <link rel="icon" href="images/favicon.png" type="image/png" sizes="32x32">
  <!-- для Apple устройств -->
  <link rel="apple-touch-icon" href="images/favicon.png" sizes="180x180">
  <title>Корзина | Seasonal Goods Store</title>

   <!-- подключение дополнительного css-файла для стилей -->
  <link rel="stylesheet" href="css/cart.css">

  <!-- подключение общего css-файла для стилей -->
  <link rel="stylesheet" href="css/style.css">

  <!-- подключение шрифтов -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header" id="header">
    <div class="header__logo"></div>
  </header>

  <main>
    <h2 id="h2__cart--title">Корзина</h2>
    <p><span id="p__cart--total">0 ₸</span></p>
    <div id="div__cart--items"></div>
    <button class="button button--checkout" onclick="alert('Заказ оформлен!')">Оформить заказ</button>
    <button class="button button--catalog--cart" onclick="window.location.href='index.html'">В каталог</button>
  </main>

  <footer class="footer" id="footer"></footer>

  <script type="module" src="js/cart.js"></script>
</body>
</html>
