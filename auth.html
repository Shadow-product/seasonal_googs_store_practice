<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Страница авторизации онлайн магазина Seasonal Goods Store. С входом / регистрацией.">
  <link rel="icon" href="images/favicon.png" type="image/png" sizes="32x32">
  <!-- для Apple устройств -->
  <link rel="apple-touch-icon" href="images/favicon.png" sizes="180x180">
  <title>Вход / регистрация | Seasonal Goods Store</title>

   <!-- подключение дополнительного css-файла для стилей -->
  <link rel="stylesheet" href="css/auth.css">

   <!-- подключение общего css-файла для стилей -->
  <link rel="stylesheet" href="css/style.css">

  <!-- подключение шрифтов -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header" id="header">
    <div class="header__logo"></div>
  </header>

  <main>
    <h2 id="h__auth--title">Авторизация</h2>
    <section class="auth">
      <div class="auth__container">
        <button class="auth__tab auth__tab--login">Вход</button>
        <button class="auth__tab auth__tab--register">Регистрация</button>

        <div class="auth__form auth__form--login"></div>
        <div class="auth__form auth__form--register auth__form--hidden"></div>
      </div>
    </section>
  </main>


  <footer class="footer" id="footer"></footer>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
